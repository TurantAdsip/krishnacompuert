<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate | KrishnaPrep</title>

    <link rel="stylesheet" href="cert.css">

</head>


<body>

    <div class="certificate">

        <!-- =========================================
             WATERMARK
        ========================================== -->

        <div class="watermark">

            <img src="../Assets/Logo.png" alt="KrishnaPrep">

        </div>


        <!-- =========================================
             TOP BORDER
        ========================================== -->

        <div class="top-border"></div>


        <!-- =========================================
             TITLE
        ========================================== -->

        <h1>
            Certificate
        </h1>

        <h3>
            OF ACHIEVEMENT
        </h3>


        <!-- =========================================
             INTRO
        ========================================== -->

        <p class="certify">
            This certificate is proudly presented to
        </p>


        <!-- =========================================
             STUDENT NAME
        ========================================== -->

        <h2 id="studentName">
            Student Name
        </h2>


        <!-- =========================================
             DESCRIPTION
        ========================================== -->

        <p class="text">
            for successfully completing the quiz and demonstrating
            excellent knowledge and dedication.
        </p>


        <!-- =========================================
             DETAILS
        ========================================== -->

        <div class="details">

            <div>

                <b>
                    Quiz
                </b>

                <span id="quizName">
                    Quiz
                </span>

            </div>


            <div>

                <b>
                    Certificate ID
                </b>

                <span id="certificateID">
                    Loading...
                </span>

            </div>


            <div>

                <b>
                    Percentage
                </b>

                <span id="percentage">
                    0%
                </span>

            </div>


            <div>

                <b>
                    Date
                </b>

                <span id="issueDate">
                    Loading...
                </span>

            </div>

        </div>


        <!-- =========================================
             SIGNATURE
        ========================================== -->
        <div class="signature">

            <!-- Authorized Signatory -->
            <div class="sign-box">
                <img src="../Assets/Sign.png" alt="Authorized Signature" class="signature-img">

                <hr>
                <span>Authorized Signatory</span>
            </div>

            <!-- KrishnaPrep Stamp -->
            <div class="sign-box">
                <img src="../Assets/gemini-svg.svg" alt="KrishnaPrep Stamp" class="stamp-img">

                <hr>
                <span>KrishnaPrep</span>
            </div>

        </div>


        <!-- =========================================
         BUTTONS
    ========================================== -->

        <div class="buttons">

            <button onclick="downloadCertificate()">
                ⬇ Download PDF
            </button>


            <button onclick="printCertificate()">
                🖨 Print
            </button>

        </div>


        <!-- =========================================
         JAVASCRIPT
    ========================================== -->

        <script src="certificate.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>

</html>
