<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Ink Color Definition -->
    <style>
      .stamp-color { fill: #002244; stroke: #002244; }
      .stamp-text { font-family: "Georgia", "Times New Roman", "Cinzel", serif; font-weight: bold; fill: #002244; }
    </style>

    <!-- Circular Paths for Text Alignment -->
    <!-- Top Text Path (Clockwise) -->
    <path id="textPathTop" d="M 65,250 A 185,185 0 1,1 435,250" fill="none" />
    
    <!-- Bottom Text Path (Clockwise) -->
    <path id="textPathBottom" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
  </defs>

  <g class="stamp-color">
    <!-- Outer Double Border -->
    <!-- Heavy Outer Circle -->
    <circle cx="250" cy="250" r="230" fill="none" stroke-width="6" />
    <!-- Fine Inner Ring -->
    <circle cx="250" cy="250" r="220" fill="none" stroke-width="2" />

    <!-- Inner Double Border -->
    <!-- Fine Outer Ring -->
    <circle cx="250" cy="250" r="140" fill="none" stroke-width="2" />
    <!-- Heavy Inner Circle -->
    <circle cx="250" cy="250" r="132" fill="none" stroke-width="4" />

    <!-- Center Icon: Minimalist Professional Laptop & Emblem -->
    <g transform="translate(250, 242)">
      <!-- Laptop Screen Outer Frame -->
      <rect x="-42" y="-38" width="84" height="56" rx="4" ry="4" fill="none" stroke-width="4" />
      
      <!-- Laptop Screen Inner Display -->
      <rect x="-35" y="-31" width="70" height="42" rx="1" ry="1" fill="none" stroke-width="1.5" />
      
      <!-- Minimal Code/Achievement Lines on Screen -->
      <line x1="-22" y1="-18" x2="10" y2="-18" stroke-width="3" stroke-linecap="round" />
      <line x1="-22" y1="-8" x2="18" y2="-8" stroke-width="3" stroke-linecap="round" />
      <line x1="-22" y1="2" x2="2" y2="2" stroke-width="3" stroke-linecap="round" />
      
      <!-- Laptop Base / Keyboard Section -->
      <path d="M -56,22 L 56,22 L 48,32 L -48,32 Z" stroke-width="2" stroke-linejoin="round" />
      <!-- Trackpad Notch -->
      <path d="M -10,22 L 10,22 L 8,25 L -8,25 Z" fill="#002244" />

      <!-- Minimal Certificate Star Below Laptop -->
      <polygon points="0,46 4,54 13,54 6,60 9,68 0,63 -9,68 -6,60 -13,54 -4,54" stroke-width="1" stroke-linejoin="round" />
    </g>

    <!-- Top Curved Text -->
    <text class="stamp-text" font-size="23.5" letter-spacing="4.5">
      <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
        KRISHNA COMPUTER CAFE
      </textPath>
    </text>

    <!-- Separator Dots (Left and Right) -->
    <circle cx="70" cy="250" r="5" />
    <circle cx="430" cy="250" r="5" />

    <!-- Bottom Curved Text (Institutional Distinction) -->
    <text class="stamp-text" font-size="19" letter-spacing="4">
      <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
        OFFICIAL SEAL OF EXCELLENCE
      </textPath>
    </text>
  </g>
</svg>
